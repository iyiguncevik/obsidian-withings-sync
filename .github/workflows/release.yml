name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Verify tag matches manifest version
        working-directory: .
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          MANIFEST_VERSION=$(node -p "require('./plugin/manifest.json').version")
          if [ "$TAG" != "$MANIFEST_VERSION" ]; then
            echo "Tag ($TAG) must exactly match plugin/manifest.json version ($MANIFEST_VERSION)."
            exit 1
          fi

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            plugin/main.js
            plugin/manifest.json
            plugin/styles.css
          generate_release_notes: true
