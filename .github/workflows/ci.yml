name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  plugin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Verify root manifest is present
        working-directory: .
        run: test -f manifest.json
      - name: Build plugin
        working-directory: .
        run: make build
